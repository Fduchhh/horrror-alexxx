<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#090a0f" rx="96"/>
  <!-- Dark vignette / grungy hospital doorway -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#450a0a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <filter id="horrorGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <!-- Iron Asylum Double Door Bars -->
  <rect x="146" y="90" width="220" height="340" rx="10" fill="url(#doorGrad)" stroke="#52525b" stroke-width="6"/>
  <!-- Door Window Grill -->
  <rect x="186" y="130" width="140" height="110" rx="6" fill="#18181b" stroke="#71717a" stroke-width="4"/>
  <line x1="220" y1="130" x2="220" y2="240" stroke="#a1a1aa" stroke-width="4"/>
  <line x1="256" y1="130" x2="256" y2="240" stroke="#a1a1aa" stroke-width="4"/>
  <line x1="292" y1="130" x2="292" y2="240" stroke="#a1a1aa" stroke-width="4"/>
  <line x1="186" y1="185" x2="326" y2="185" stroke="#a1a1aa" stroke-width="4"/>
  <!-- Ominous glowing red eyes in the dark window -->
  <circle cx="236" cy="180" r="7" fill="#ef4444" filter="url(#horrorGlow)"/>
  <circle cx="276" cy="180" r="7" fill="#ef4444" filter="url(#horrorGlow)"/>
  <circle cx="236" cy="180" r="3" fill="#fef08a"/>
  <circle cx="276" cy="180" r="3" fill="#fef08a"/>
  <!-- Bloody scratches & Locker slats -->
  <path d="M 210 270 L 218 330 M 235 265 L 246 345 M 260 272 L 270 335" stroke="#991b1b" stroke-width="4" stroke-linecap="round"/>
  <!-- Asylum Cross Warning Symbol -->
  <rect x="246" y="365" width="20" height="50" rx="3" fill="#b91c1c"/>
  <rect x="231" y="380" width="50" height="20" rx="3" fill="#b91c1c"/>
</svg>
